name: collect
on:
  schedule:
    - cron: "10 12 * * 6"   # 토 21:10 KST
    - cron: "40 12 * * 6"   # 토 21:40 KST (발표 지연 대비)
    - cron: "10 0 * * 0"    # 일 09:10 KST (당첨금 확정치 반영)
  workflow_dispatch: {}     # 수동 실행 (첫 백필 포함)
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: collect
        run: python scripts/collect.py
      - name: commit
        if: always()   # 수집 중 실패해도 받은 만큼은 저장
        run: |
          git config user.name "lotto-bot"
          git config user.email "lotto-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "data: $(TZ=Asia/Seoul date +%F)" && git push)
      - name: purge cdn
        if: always()
        run: |
          curl -s https://purge.jsdelivr.net/gh/${{ github.repository }}@main/data/latest.json
          curl -s https://purge.jsdelivr.net/gh/${{ github.repository }}@main/data/lotto-all.json
